<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início - Sala de Aula</title>
    <link rel="icon" href="https://ssl.gstatic.com/classroom/favicon.png">
    <style>
        *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0b1020;color:#f5f7ff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
        #app-container{display:flex;height:100vh;overflow:hidden}
        #sidebar{width:300px;background:#111827;border-right:1px solid #26304a;height:100vh;overflow-y:auto;padding:16px;flex-shrink:0;transition:left 0.3s;position:fixed;left:0;top:0;bottom:0;z-index:20}
        #sidebar.closed{left:-320px}
        #sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:15}
        #sidebar-overlay.show{display:block}
        .app{flex:1;max-width:1000px;height:100vh;margin:auto;display:grid;grid-template-rows:auto 1fr auto;min-width:0}
        header{padding:16px 20px;border-bottom:1px solid #26304a;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
        .brand{display:flex;gap:12px;align-items:center}.logo{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:#7357ff;font-weight:900}.sub{font-size:12px;color:#8e9ab5}
        .header-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
        button{cursor:pointer;color:#fff;background:#19233b;border:1px solid #2b3857;border-radius:10px;padding:9px 12px}
        button:hover{background:#22304d}
        #chat{overflow:auto;padding:24px 14px}.empty{text-align:center;margin:12vh auto;max-width:650px}.empty h2{font-size:42px;margin:0 0 10px}.empty p{color:#9aa7c0}
        .suggestions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:20px}.message{max-width:800px;margin:16px auto;display:flex;gap:10px}.message.user{justify-content:flex-end}
        .avatar{width:32px;height:32px;flex:none;border-radius:9px;background:#19233b;display:grid;place-items:center;font-weight:800}
        .bubble{max-width:80%;padding:12px 15px;border:1px solid #2a3550;background:#152039;border-radius:16px;white-space:normal;overflow-wrap:anywhere;line-height:1.55}.message.user .bubble{white-space:pre-wrap}
        .user .bubble{background:#26385f}.user .avatar{order:2}form{padding:12px 14px 18px;border-top:1px solid #26304a}
        .markdown-body p{margin:0 0 10px}.markdown-body p:last-child{margin-bottom:0}
        .markdown-body h1,.markdown-body h2,.markdown-body h3,.markdown-body h4{margin:16px 0 8px;line-height:1.25}
        .markdown-body h1:first-child,.markdown-body h2:first-child,.markdown-body h3:first-child{margin-top:0}
        .markdown-body h1{font-size:1.45em}.markdown-body h2{font-size:1.3em}.markdown-body h3{font-size:1.15em}
        .markdown-body ul,.markdown-body ol{margin:8px 0 10px 22px;padding:0}
        .markdown-body li{margin:4px 0}
        .markdown-body strong{font-weight:800;color:#fff}
        .markdown-body em{font-style:italic}
        .markdown-body blockquote{margin:10px 0;padding:8px 12px;border-left:3px solid #7357ff;background:#111a2f;color:#c8d1e4;border-radius:0 8px 8px 0}
        .markdown-body code{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;background:#0c1324;border:1px solid #26304a;border-radius:5px;padding:2px 5px;font-size:.92em}
        .markdown-body pre{margin:12px 0;padding:12px;background:#090f1d;border:1px solid #26304a;border-radius:10px;overflow:auto}
        .markdown-body pre code{display:block;background:none;border:0;padding:0;white-space:pre;overflow-wrap:normal}
        .markdown-body a{color:#9b8cff;text-decoration:underline;text-underline-offset:2px}
        .markdown-body hr{border:0;border-top:1px solid #2a3550;margin:16px 0}
        .markdown-body table{width:100%;border-collapse:collapse;margin:12px 0;display:block;overflow-x:auto}
        .markdown-body th,.markdown-body td{border:1px solid #2a3550;padding:7px 9px;text-align:left}
        .markdown-body th{background:#111a2f}

        .composer{max-width:800px;margin:auto;display:flex;gap:8px;padding:8px;background:#121a2d;border:1px solid #2a3550;border-radius:16px}
        textarea{flex:1;background:none;color:#fff;border:0;outline:0;resize:none;padding:10px;font:inherit;max-height:150px}#send{background:#7357ff;font-weight:800}
        .status{max-width:800px;margin:6px auto 0;color:#7f8ca7;font-size:11px;text-align:right}
        .typing span{display:inline-block;width:6px;height:6px;border-radius:50%;background:#9aa7c0;margin:0 2px;animation:b .8s infinite}.typing span:nth-child(2){animation-delay:.12s}.typing span:nth-child(3){animation-delay:.24s}
        @keyframes b{50%{transform:translateY(-4px);opacity:.4}}
        #user-info{display:flex;align-items:center;gap:8px}
        #user-info img{width:32px;height:32px;border-radius:50%;object-fit:cover}
        #user-name{font-weight:600;color:#fff}
        #auth-button,#logout-button{padding:8px 12px}
        #sidebar h3{margin:0 0 16px;font-size:18px;color:#fff}
        .new-conv-btn{width:100%;margin-bottom:24px;background:#7357ff;border:none;font-weight:600;padding:14px;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px}
        .new-conv-btn:hover{background:#5f45e0}
        .continue-text{margin:0 0 12px;color:#9aa7c0;font-size:13px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase}
        .conv-list{list-style:none;padding:0;margin:0}
        .conv-item{display:flex;align-items:center;justify-content:space-between;padding:12px;border-radius:8px;cursor:pointer;transition:background 0.2s;border:1px solid transparent;margin-bottom:4px;position:relative}
        .conv-item:hover{background:#1c2940;border-color:#2b3857}
        .conv-item.active{background:#26385f;border-color:#7357ff}
        .conv-title{flex:1;font-size:14px;color:#ddd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-right:8px}
        .conv-date{font-size:11px;color:#8e9ab5;white-space:nowrap;margin-right:8px}
        .conv-actions{display:flex;gap:4px;opacity:0;transition:opacity 0.2s}
        .conv-item:hover .conv-actions{opacity:1}
        .conv-rename,.conv-delete{background:none;border:none;color:#8e9ab5;font-size:14px;cursor:pointer;padding:4px 6px;border-radius:4px}
        .conv-rename:hover{color:#7357ff;background:#1a2540}
        .conv-delete:hover{color:#f88;background:#1a2540}
        .empty-sidebar{color:#7f8ca7;text-align:center;margin-top:20px;font-size:14px}
        .rename-input{flex:1;background:#121a2d;border:1px solid #7357ff;border-radius:6px;color:#fff;padding:6px 8px;font-size:14px;outline:none}
        .rename-actions{display:flex;gap:4px}
        .rename-confirm,.rename-cancel{background:none;border:none;color:#fff;font-size:14px;cursor:pointer;padding:4px 6px;border-radius:4px}
        .rename-confirm{color:#4caf50}
        .rename-cancel{color:#f88}
        .settings-section{margin-top:20px;padding-top:16px;border-top:1px solid #26304a}
        .settings-btn{background:none;border:1px solid #2b3857;color:#9aa7c0;font-size:13px;padding:8px 12px;border-radius:8px;cursor:pointer;width:100%;text-align:left}
        .settings-btn:hover{background:#1c2940;color:#fff}
        .settings-panel{margin-top:10px;padding:12px;background:#1a2540;border-radius:8px}
        .settings-panel label{display:block;color:#c5cde0;font-size:12px;margin-bottom:4px}
        .settings-panel input{width:100%;background:#121a2d;border:1px solid #2b3857;color:#fff;border-radius:6px;padding:8px;margin-bottom:10px;font-size:14px}
        .settings-save{background:#7357ff;border:none;color:#fff;padding:8px 12px;border-radius:6px;cursor:pointer;width:100%}
        .settings-save:hover{background:#5f45e0}
        #hamburger{display:inline-block;background:none;border:none;color:#fff;font-size:24px;padding:4px;cursor:pointer}
        @media(max-width:768px){
            #sidebar.closed{left:-320px}
            #sidebar:not(.closed){left:0}
            .app{max-width:100%}
            header{padding:12px}
        }
        @media(max-width:600px){.bubble{max-width:88%}.empty h2{font-size:34px}}
    </style>
</head>
<body>
    <div id="app-container">
        <div id="sidebar-overlay"></div>

        <aside id="sidebar">
            <h3>CaiobaGPT</h3>
            <button class="new-conv-btn" id="new-conv-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>
                    <path d="m15 5 4 4"/>
                </svg>
                Nova Conversa
            </button>
            <p class="continue-text">Continuar conversando</p>
            <ul class="conv-list" id="conv-list"></ul>
            <div class="empty-sidebar" id="empty-sidebar">Nenhuma conversa ainda.</div>

            <div class="settings-section">
                <button class="settings-btn" id="settings-btn">⚙️ Como devemos nos chamar</button>
                <div class="settings-panel" id="settings-panel" style="display:none;">
                    <label>Como o CaiobaGPT deve chamar você?</label>
                    <input type="text" id="user-call-name" placeholder="Ex: Caio, Caioba, senhor...">

                    <label>Quais pronomes o CaiobaGPT deve usar para você?</label>
                    <input type="text" id="user-pronoun" placeholder="Ex: ele/dele, ela/dela, elu/delu...">

                    <label>Quais pronomes você prefere usar para o CaiobaGPT?</label>
                    <input type="text" id="assistant-pronoun" placeholder="Ex: ele/dele, ela/dela, elu/delu...">

                    <button class="settings-save" id="save-pronouns" type="button">Salvar preferências</button>
                </div>
            </div>
        </aside>

        <main class="app">
            <header>
                <div class="brand">
                    <button id="hamburger" aria-label="Abrir menu">☰</button>
                    <div class="logo">C</div>
                    <div><b>CaiobaGPT</b><div class="sub">Seu assistente de IA, com personalidade própria.</div></div>
                </div>
                <div class="header-actions">
                    <div id="user-info"></div>
                    <button id="clear">Limpar</button>
                </div>
            </header>
            <section id="chat"></section>
            <form id="form">
                <div class="composer">
                    <textarea id="input" rows="1" placeholder="Manda a braba..."></textarea>
                    <button id="send" type="submit">Enviar</button>
                </div>
                <div class="status" id="status">Histórico salvo neste navegador.</div>
            </form>
        </main>
    </div>

    <!-- Markdown para as respostas do CaiobaGPT -->
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, collection, setDoc, updateDoc, deleteDoc, getDoc, getDocs, query, orderBy, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBAiXd7T_FsYW260mtO3UYFpCsxJpn4Gco",
            authDomain: "caiobagpt-38f81.firebaseapp.com",
            projectId: "caiobagpt-38f81",
            storageBucket: "caiobagpt-38f81.firebasestorage.app",
            messagingSenderId: "847377336410",
            appId: "1:847377336410:web:d1149f5da6c84e3fcef063",
            measurementId: "G-DDGEY2MQ1F"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        if (window.marked) {
            window.marked.setOptions({
                gfm: true,
                breaks: true
            });
        }

        const WORKER_URL = "https://caiobagpt.caiosartor01.workers.dev";
        const chatEl = document.querySelector("#chat");
        const form = document.querySelector("#form");
        const input = document.querySelector("#input");
        const statusEl = document.querySelector("#status");
        const clearBtn = document.querySelector("#clear");
        const hamburgerBtn = document.querySelector("#hamburger");
        const sidebar = document.querySelector("#sidebar");
        const sidebarOverlay = document.querySelector("#sidebar-overlay");
        const newConvBtn = document.querySelector("#new-conv-btn");
        const convListEl = document.querySelector("#conv-list");
        const emptySidebarEl = document.querySelector("#empty-sidebar");
        const userInfoEl = document.querySelector("#user-info");
        const settingsBtn = document.querySelector("#settings-btn");
        const settingsPanel = document.querySelector("#settings-panel");
        const userCallNameInput = document.querySelector("#user-call-name");
        const userPronounInput = document.querySelector("#user-pronoun");
        const assistantPronounInput = document.querySelector("#assistant-pronoun");
        const savePronounsBtn = document.querySelector("#save-pronouns");

        let currentUser = null;
        let currentConversationId = null;
        let currentConversationMessages = [];
        let conversationRef = null;
        let isRenaming = false;
        let settings = { userCallName: '', userPronoun: '', assistantPronoun: '' };

        function formatDate(timestamp) {
            if (!timestamp) return "";
            const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            return date.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
        }

        function generateTitle(text) {
            const cleanText = text.replace(/[.!?]+$/, '').trim();
            return cleanText.length > 50 ? cleanText.slice(0, 50) + "..." : cleanText;
        }

        function showStatus(message) {
            statusEl.textContent = message;
        }

        function toggleSidebar() {
            const isClosed = sidebar.classList.contains('closed');
            if (isClosed) {
                sidebar.classList.remove('closed');
                sidebarOverlay.classList.add('show');
            } else {
                sidebar.classList.add('closed');
                sidebarOverlay.classList.remove('show');
            }
        }

        function closeSidebar() {
            sidebar.classList.add('closed');
            sidebarOverlay.classList.remove('show');
        }

        function renderAuthUI(user) {
            userInfoEl.innerHTML = "";
            if (user) {
                const photoURL = user.photoURL;
                const displayName = user.displayName || "Usuário";
                const nameSpan = document.createElement('span');
                nameSpan.id = 'user-name';
                nameSpan.textContent = displayName;
                const img = document.createElement('img');
                img.src = photoURL || '';
                img.alt = 'Foto do usuário';
                img.onerror = () => { img.style.display = 'none'; };
                const logoutBtn = document.createElement('button');
                logoutBtn.id = 'logout-button';
                logoutBtn.textContent = 'Sair';
                logoutBtn.onclick = async () => {
                    try {
                        await signOut(auth);
                        showStatus('Você saiu da conta.');
                    } catch (error) {
                        console.error('Logout error:', error);
                        showStatus('Erro ao sair.');
                    }
                };
                userInfoEl.append(img, nameSpan, logoutBtn);
            } else {
                const loginBtn = document.createElement('button');
                loginBtn.id = 'auth-button';
                loginBtn.textContent = 'Entrar com Google';
                loginBtn.onclick = async () => {
                    const provider = new GoogleAuthProvider();
                    try {
                        await signInWithPopup(auth, provider);
                        showStatus('Login realizado com sucesso.');
                    } catch (error) {
                        console.error('Login error:', error);
                        showStatus('Erro ao fazer login: ' + error.message);
                    }
                };
                userInfoEl.appendChild(loginBtn);
            }
        }

        async function loadSettings() {
            const localKey = currentUser ? `caiobagpt_preferences_${currentUser.uid}` : 'caiobagpt_preferences_guest';

            try {
                const local = JSON.parse(localStorage.getItem(localKey) || '{}');
                settings = {
                    userCallName: local.userCallName || '',
                    userPronoun: local.userPronoun || '',
                    assistantPronoun: local.assistantPronoun || ''
                };
            } catch {
                settings = { userCallName: '', userPronoun: '', assistantPronoun: '' };
            }

            if (currentUser) {
                const settingsRef = doc(db, 'users', currentUser.uid, 'settings', 'pronouns');
                try {
                    const docSnap = await getDoc(settingsRef);
                    if (docSnap.exists()) {
                        const cloud = docSnap.data();
                        settings = {
                            userCallName: cloud.userCallName || cloud.displayName || settings.userCallName || '',
                            userPronoun: cloud.userPronoun || settings.userPronoun || '',
                            assistantPronoun: cloud.assistantPronoun || settings.assistantPronoun || ''
                        };
                        localStorage.setItem(localKey, JSON.stringify(settings));
                    }
                } catch (error) {
                    console.warn('Não foi possível carregar preferências do Firestore. Usando cópia local.', error);
                }
            }

            userCallNameInput.value = settings.userCallName || '';
            userPronounInput.value = settings.userPronoun || '';
            assistantPronounInput.value = settings.assistantPronoun || '';
        }

        async function saveSettings() {
            const clean = (value, max = 60) => value.trim().replace(/\s+/g, ' ').slice(0, max);

            const userCallName = clean(userCallNameInput.value);
            const userPronoun = clean(userPronounInput.value);
            const assistantPronoun = clean(assistantPronounInput.value);

            settings = { userCallName, userPronoun, assistantPronoun };

            const localKey = currentUser ? `caiobagpt_preferences_${currentUser.uid}` : 'caiobagpt_preferences_guest';
            localStorage.setItem(localKey, JSON.stringify(settings));

            if (!currentUser) {
                showStatus('Preferências salvas neste navegador. Faça login para sincronizar na nuvem.');
                return;
            }

            const settingsRef = doc(db, 'users', currentUser.uid, 'settings', 'pronouns');

            try {
                await setDoc(settingsRef, settings, { merge: true });
                showStatus('Preferências salvas com sucesso.');
            } catch (error) {
                console.error('Erro ao salvar preferências no Firestore:', error);
                showStatus('Preferências salvas neste navegador, mas não foi possível sincronizar com o Firestore.');
            }
        }

        function escapeHtml(text) {
            return String(text)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function renderMarkdown(text) {
            const source = String(text ?? "");

            // Se algum CDN estiver indisponível, o chat continua funcionando
            // em texto puro em vez de quebrar a interface.
            if (!window.marked || !window.DOMPurify) {
                return escapeHtml(source).replace(/\n/g, "<br>");
            }

            const parsed = window.marked.parse(source, {
                gfm: true,
                breaks: true
            });

            // Nunca injeta HTML do modelo diretamente sem sanitizar.
            return window.DOMPurify.sanitize(parsed, {
                USE_PROFILES: { html: true }
            });
        }

        function prepareMarkdownLinks(container) {
            container.querySelectorAll("a").forEach(link => {
                link.target = "_blank";
                link.rel = "noopener noreferrer";
            });
        }

        function renderChat() {
            chatEl.innerHTML = "";
            if (!currentConversationMessages.length) {
                chatEl.innerHTML = '<div class="empty"><h2>Fala aí. 👊</h2><p>Eu sou o CaiobaGPT. Posso explicar assuntos, programar, ajudar em projetos e trocar ideia.</p><div class="suggestions"><button>Me explica como uma IA aprende.</button><button>Me ajuda a criar um site.</button><button>Me dá uma ideia de projeto em JavaScript.</button></div></div>';
                const suggestionButtons = chatEl.querySelectorAll(".suggestions button");
                suggestionButtons.forEach(btn => {
                    btn.onclick = () => {
                        input.value = btn.textContent;
                        input.focus();
                    };
                });
                return;
            }
            for (const m of currentConversationMessages) {
                const row = document.createElement("div");
                row.className = "message " + (m.role === "user" ? "user" : "assistant");
                const avatar = document.createElement("div");
                avatar.className = "avatar";
                avatar.textContent = m.role === "user" ? "V" : "C";
                const bubble = document.createElement("div");
                bubble.className = "bubble";

                if (m.role === "assistant") {
                    bubble.classList.add("markdown-body");
                    bubble.innerHTML = renderMarkdown(m.content);
                    prepareMarkdownLinks(bubble);
                } else {
                    // Mensagens do usuário continuam como texto puro por segurança.
                    bubble.textContent = m.content;
                }

                row.append(avatar, bubble);
                chatEl.append(row);
            }
            chatEl.scrollTop = chatEl.scrollHeight;
        }

        function typingIndicator() {
            const row = document.createElement("div");
            row.id = "typing";
            row.className = "message assistant";
            row.innerHTML = '<div class="avatar">C</div><div class="bubble typing"><span></span><span></span><span></span></div>';
            chatEl.append(row);
            chatEl.scrollTop = chatEl.scrollHeight;
        }

        function removeTypingIndicator() {
            document.querySelector("#typing")?.remove();
        }

        async function loadConversations() {
            if (!currentUser) {
                convListEl.innerHTML = "";
                emptySidebarEl.style.display = 'block';
                return;
            }
            const uid = currentUser.uid;
            const conversationsRef = collection(db, 'users', uid, 'conversations');
            const q = query(conversationsRef, orderBy('updatedAt', 'desc'));
            try {
                const querySnapshot = await getDocs(q);
                convListEl.innerHTML = "";
                if (querySnapshot.empty) {
                    emptySidebarEl.style.display = 'block';
                } else {
                    emptySidebarEl.style.display = 'none';
                    querySnapshot.forEach((docSnap) => {
                        const data = docSnap.data();
                        const li = document.createElement('li');
                        li.className = 'conv-item';
                        li.dataset.id = docSnap.id;
                        if (docSnap.id === currentConversationId) li.classList.add('active');

                        const titleContainer = document.createElement('div');
                        titleContainer.style.cssText = 'flex:1;min-width:0;cursor:pointer;';
                        titleContainer.onclick = () => openConversation(docSnap.id);

                        const titleSpan = document.createElement('div');
                        titleSpan.className = 'conv-title';
                        titleSpan.textContent = data.title || 'Sem título';

                        const dateSpan = document.createElement('div');
                        dateSpan.className = 'conv-date';
                        dateSpan.textContent = formatDate(data.updatedAt);

                        titleContainer.append(titleSpan, dateSpan);

                        const actionsContainer = document.createElement('div');
                        actionsContainer.className = 'conv-actions';

                        const renameBtn = document.createElement('button');
                        renameBtn.className = 'conv-rename';
                        renameBtn.innerHTML = '✏️';
                        renameBtn.title = 'Renomear conversa';
                        renameBtn.onclick = (e) => {
                            e.stopPropagation();
                            startRename(docSnap.id, titleSpan, data.title);
                        };

                        const deleteBtn = document.createElement('button');
                        deleteBtn.className = 'conv-delete';
                        deleteBtn.innerHTML = '🗑';
                        deleteBtn.title = 'Excluir conversa';
                        deleteBtn.onclick = async (e) => {
                            e.stopPropagation();
                            if (confirm('Excluir esta conversa?')) {
                                await deleteConversation(docSnap.id);
                            }
                        };

                        actionsContainer.append(renameBtn, deleteBtn);
                        li.append(titleContainer, actionsContainer);
                        convListEl.appendChild(li);
                    });
                }
            } catch (error) {
                console.error('Erro ao carregar conversas:', error);
                showStatus('Erro ao carregar histórico.');
            }
        }

        function startRename(conversationId, titleElement, currentTitle) {
            if (isRenaming) return;
            isRenaming = true;
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'rename-input';
            input.value = currentTitle;
            input.placeholder = 'Novo título...';
            const confirmBtn = document.createElement('button');
            confirmBtn.className = 'rename-confirm';
            confirmBtn.innerHTML = '✓';
            confirmBtn.title = 'Confirmar';
            const cancelBtn = document.createElement('button');
            cancelBtn.className = 'rename-cancel';
            cancelBtn.innerHTML = '✕';
            cancelBtn.title = 'Cancelar';
            const actionsContainer = document.createElement('div');
            actionsContainer.className = 'rename-actions';
            actionsContainer.append(confirmBtn, cancelBtn);
            const parentContainer = titleElement.parentElement;
            parentContainer.replaceChild(input, titleElement);
            parentContainer.appendChild(actionsContainer);
            input.focus();
            input.select();
            const confirmRename = async () => {
                const newTitle = input.value.trim() || currentTitle;
                await renameConversation(conversationId, newTitle);
                isRenaming = false;
                await loadConversations();
            };
            const cancelRename = () => {
                isRenaming = false;
                loadConversations();
            };
            confirmBtn.onclick = confirmRename;
            cancelBtn.onclick = cancelRename;
            input.onkeydown = (e) => {
                if (e.key === 'Enter') confirmRename();
                else if (e.key === 'Escape') cancelRename();
            };
        }

        async function renameConversation(conversationId, newTitle) {
            if (!currentUser) return;
            const uid = currentUser.uid;
            try {
                await updateDoc(doc(db, 'users', uid, 'conversations', conversationId), { title: newTitle });
                showStatus('Conversa renomeada.');
            } catch (error) {
                console.error('Erro ao renomear conversa:', error);
                showStatus('Erro ao renomear conversa.');
            }
        }

        async function openConversation(conversationId) {
            if (!currentUser || isRenaming) return;
            closeSidebar();
            const uid = currentUser.uid;
            const docRef = doc(db, 'users', uid, 'conversations', conversationId);
            try {
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    currentConversationId = conversationId;
                    conversationRef = docRef;
                    currentConversationMessages = docSnap.data().messages || [];
                    renderChat();
                    showStatus('Conversa carregada.');
                    document.querySelectorAll('.conv-item').forEach(el => {
                        el.classList.toggle('active', el.dataset.id === conversationId);
                    });
                } else {
                    showStatus('Conversa não encontrada.');
                }
            } catch (error) {
                console.error('Erro ao abrir conversa:', error);
                showStatus('Erro ao abrir conversa.');
            }
        }

        async function deleteConversation(conversationId) {
            if (!currentUser) return;
            const uid = currentUser.uid;
            try {
                await deleteDoc(doc(db, 'users', uid, 'conversations', conversationId));
                if (conversationId === currentConversationId) {
                    currentConversationId = null;
                    conversationRef = null;
                    currentConversationMessages = [];
                    renderChat();
                    showStatus('Conversa excluída.');
                }
                await loadConversations();
            } catch (error) {
                console.error('Erro ao excluir conversa:', error);
                showStatus('Erro ao excluir conversa.');
            }
        }

        function startNewConversation() {
            currentConversationId = null;
            conversationRef = null;
            currentConversationMessages = [];
            renderChat();
            closeSidebar();
            showStatus('Nova conversa iniciada.');
            document.querySelectorAll('.conv-item').forEach(el => el.classList.remove('active'));
        }

        // ============================================================
        // MEMÓRIA DE LONGO PRAZO - FIRESTORE
        // ============================================================

        const MEMORY_CATEGORIES = new Set([
            "preference",
            "project",
            "interest",
            "goal",
            "personalization",
            "other"
        ]);

        function normalizeMemoryText(value) {
            return String(value || "")
                .trim()
                .replace(/\s+/g, " ")
                .slice(0, 300);
        }

        function createMemoryKey(text) {
            return normalizeMemoryText(text)
                .toLocaleLowerCase("pt-BR")
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/[^\p{L}\p{N}\s]/gu, "")
                .replace(/\s+/g, " ")
                .trim()
                .slice(0, 300);
        }

        function containsSensitiveMemorySignal(text) {
            const value = String(text || "").toLocaleLowerCase("pt-BR");

            const blockedPatterns = [
                /\bsenha\b/,
                /\bpassword\b/,
                /\bpin\b/,
                /\btoken\b/,
                /\bapi[\s_-]?key\b/,
                /\bchave privada\b/,
                /\bprivate key\b/,
                /\bsecret key\b/,
                /\bcart[aã]o de cr[eé]dito\b/,
                /\bn[uú]mero do cart[aã]o\b/,
                /\bcvv\b/,
                /\bcpf\b/,
                /\brg\b/,
                /\bpassaporte\b/,
                /\bendere[cç]o completo\b/,
                /\bcoordenadas\b/
            ];

            return blockedPatterns.some(pattern => pattern.test(value));
        }

        function normalizeMemoryCandidate(candidate) {
            if (!candidate || candidate.shouldSave !== true) return null;

            const text = normalizeMemoryText(candidate.text);
            if (!text || containsSensitiveMemorySignal(text)) return null;

            const category = MEMORY_CATEGORIES.has(candidate.category)
                ? candidate.category
                : "other";

            const rawImportance = Number(candidate.importance);
            const importance = Number.isFinite(rawImportance)
                ? Math.min(10, Math.max(1, Math.round(rawImportance)))
                : 5;

            const normalizedText = createMemoryKey(text);
            if (!normalizedText) return null;

            return {
                text,
                normalizedText,
                category,
                importance
            };
        }

        async function saveMemoryCandidate(candidate) {
            if (!currentUser) return { status: "ignored" };

            const memory = normalizeMemoryCandidate(candidate);
            if (!memory) return { status: "ignored" };

            const memoriesRef = collection(
                db,
                "users",
                currentUser.uid,
                "memories"
            );

            try {
                // Evita salvar a mesma memória várias vezes.
                const duplicateQuery = query(
                    memoriesRef,
                    where("normalizedText", "==", memory.normalizedText)
                );

                const duplicateSnapshot = await getDocs(duplicateQuery);

                if (!duplicateSnapshot.empty) {
                    const existingDoc = duplicateSnapshot.docs[0];
                    const existingData = existingDoc.data();

                    await updateDoc(existingDoc.ref, {
                        text: memory.text,
                        category: memory.category,
                        importance: Math.max(
                            Number(existingData.importance) || 1,
                            memory.importance
                        ),
                        updatedAt: serverTimestamp()
                    });

                    console.log("Memória existente atualizada:", memory);
                    return { status: "updated", memory };
                }

                const memoryRef = doc(memoriesRef);

                await setDoc(memoryRef, {
                    id: memoryRef.id,
                    text: memory.text,
                    normalizedText: memory.normalizedText,
                    category: memory.category,
                    importance: memory.importance,
                    createdAt: serverTimestamp(),
                    updatedAt: serverTimestamp()
                });

                console.log("Nova memória salva no Firestore:", memory);
                return { status: "saved", memory };

            } catch (error) {
                console.error("Erro ao salvar memória no Firestore:", error);

                // A memória nunca deve impedir a conversa de funcionar.
                return {
                    status: "error",
                    error
                };
            }
        }

        async function sendMessage(text) {
            text = text.trim();
            if (!text) return;
            if (!currentUser) {
                showStatus('Faça login para enviar mensagens.');
                alert('Você precisa estar logado para enviar mensagens e salvar conversas.');
                return;
            }
            if (!currentConversationId) {
                conversationRef = doc(collection(db, 'users', currentUser.uid, 'conversations'));
                currentConversationMessages = [{ role: 'user', content: text }];
            } else {
                currentConversationMessages.push({ role: 'user', content: text });
            }
            renderChat();
            input.value = "";
            showStatus("CaiobaGPT está pensando...");
            typingIndicator();
            try {
                const payload = {
                    messages: currentConversationMessages,
                    preferences: {
                        userCallName: settings.userCallName || null,
                        userPronoun: settings.userPronoun || null,
                        assistantPronoun: settings.assistantPronoun || null
                    },
                    userCallName: settings.userCallName || null,
                    userPronoun: settings.userPronoun || null,
                    assistantPronoun: settings.assistantPronoun || null,
                    systemPrompt: [
                        'Você é o CaiobaGPT.',
                        settings.userCallName
                            ? `Chame o usuário de "${settings.userCallName}" quando for natural.`
                            : 'O usuário não informou uma forma especial de tratamento.',
                        settings.userPronoun
                            ? `Ao se referir ao usuário em terceira pessoa, use os pronomes "${settings.userPronoun}".`
                            : 'O usuário não informou pronomes.',
                        settings.assistantPronoun
                            ? `Quando seus próprios pronomes forem relevantes, respeite a preferência "${settings.assistantPronoun}".`
                            : 'Não há preferência de pronome para o CaiobaGPT.',
                        'Não force nomes ou pronomes em toda frase. Use-os apenas quando forem linguisticamente necessários ou naturais.'
                    ].join(' ')
                };
                const response = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || "Erro na IA.");

                removeTypingIndicator();

                currentConversationMessages.push({
                    role: 'assistant',
                    content: data.response || "Não recebi uma resposta da IA."
                });

                renderChat();

                // PASSO 3.3:
                // Se o Worker detectou algo útil para lembrar,
                // salva automaticamente na conta do usuário no Firestore.
                const memoryResult = await saveMemoryCandidate(
                    data.memoryCandidate
                );
                if (!currentConversationId) {
                    const title = generateTitle(text);
                    await setDoc(conversationRef, {
                        id: conversationRef.id,
                        title: title,
                        messages: currentConversationMessages,
                        createdAt: serverTimestamp(),
                        updatedAt: serverTimestamp()
                    });
                    currentConversationId = conversationRef.id;
                    if (memoryResult.status === "saved") {
                        showStatus('Conversa salva • nova memória salva no Firestore.');
                    } else if (memoryResult.status === "updated") {
                        showStatus('Conversa salva • memória existente atualizada.');
                    } else if (memoryResult.status === "error") {
                        showStatus('Conversa salva • não foi possível salvar a memória.');
                    } else {
                        showStatus('Conversa salva no Firestore.');
                    }
                } else {
                    await updateDoc(conversationRef, {
                        messages: currentConversationMessages,
                        updatedAt: serverTimestamp()
                    });
                    if (memoryResult.status === "saved") {
                        showStatus('Conversa atualizada • nova memória salva no Firestore.');
                    } else if (memoryResult.status === "updated") {
                        showStatus('Conversa atualizada • memória existente atualizada.');
                    } else if (memoryResult.status === "error") {
                        showStatus('Conversa atualizada • não foi possível salvar a memória.');
                    } else {
                        showStatus('Conversa atualizada.');
                    }
                }
                await loadConversations();
            } catch (error) {
                removeTypingIndicator();
                if (currentConversationMessages.length > 0 && currentConversationMessages[currentConversationMessages.length - 1].role === 'user') {
                    currentConversationMessages.pop();
                }
                renderChat();
                showStatus("Erro ao conectar com a IA.");
                alert("Não consegui falar com o CaiobaGPT: " + error.message);
            }
        }

        form.onsubmit = (e) => {
            e.preventDefault();
            sendMessage(input.value);
        };

        input.onkeydown = (e) => {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                form.requestSubmit();
            }
        };

        clearBtn.onclick = () => {
            if (currentConversationId || currentConversationMessages.length > 0) {
                startNewConversation();
            } else {
                showStatus('O chat já está vazio.');
            }
        };

        hamburgerBtn.onclick = () => toggleSidebar();
        sidebarOverlay.onclick = () => closeSidebar();
        newConvBtn.onclick = startNewConversation;

        settingsBtn.onclick = () => {
            const isVisible = settingsPanel.style.display !== 'none';
            settingsPanel.style.display = isVisible ? 'none' : 'block';
        };

        // Mudança importante: usar addEventListener para o botão salvar
        savePronounsBtn.addEventListener('click', saveSettings);

        onAuthStateChanged(auth, async (user) => {
            currentUser = user;
            renderAuthUI(user);
            if (user) {
                showStatus('Bem-vindo, ' + (user.displayName || 'usuário') + '!');
                await loadSettings();
                await loadConversations();
            } else {
                currentConversationId = null;
                conversationRef = null;
                currentConversationMessages = [];
                settings = { userCallName: '', userPronoun: '', assistantPronoun: '' };
                userCallNameInput.value = '';
                userPronounInput.value = '';
                assistantPronounInput.value = '';
                renderChat();
                convListEl.innerHTML = "";
                emptySidebarEl.style.display = 'block';
                showStatus('Você está deslogado. Faça login para salvar conversas.');
            }
        });

        function init() {
            if (window.innerWidth <= 768) {
                sidebar.classList.add('closed');
            }
            renderChat();
            renderAuthUI(null);
            showStatus('Histórico salvo neste navegador (para salvar na nuvem, faça login).');
        }

        window.addEventListener('resize', () => {
            if (window.innerWidth > 768) {
                sidebar.classList.remove('closed');
                sidebarOverlay.classList.remove('show');
            } else {
                if (!sidebar.classList.contains('closed')) {
                    // mantém estado
                } else {
                    sidebar.classList.add('closed');
                }
            }
        });

        init();
    </script>
</body>
